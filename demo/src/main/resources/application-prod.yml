# Production Environment Configuration
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain

spring:
  application:
    name: demo-system

  # Database - Production
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: ${DB_MIN_IDLE:10}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1

  # JPA Configuration - Production
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQL8Dialect
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  # Redis - Production
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      timeout: 60000ms
      lettuce:
        pool:
          max-active: 10
          max-idle: 8
          min-idle: 2
          max-wait: -1ms

  # RabbitMQ - Production
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 10
        retry:
          enabled: true
          initial-interval: 5000
          max-attempts: 5
          max-interval: 30000
          multiplier: 2

  # Mail Config - Production
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  # File Upload
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  # DevTools disabled in production
  devtools:
    add-properties: false

# JWT Configuration - MUST use environment variables in production
jwt:
  expiryMinutes: ${JWT_EXPIRY_MINUTES}
  expiryDay: ${JWT_EXPIRY_DAY}
  accessKey: ${JWT_ACCESS_KEY}
  refreshKey: ${JWT_REFRESH_KEY}

# OTP Configuration
otp:
  expiry-minutes: ${OTP_EXPIRY_MINUTES:5}
  verify-key-expiry-minutes: 10
  max-send-count: 3
  resend-limit-minutes: 10
  otp-length: 6

# API Documentation - Disabled in production
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

openapi:
  service:
    api-docs: demo-system
    server: ${API_BASE_URL}
    title: Demo System API
    version: 1.0.0

# Logging - Production (less verbose, focused on errors)
logging:
  level:
    root: WARN
    com.training.demo: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: /var/log/demo-system/application.log
    max-size: 50MB
    max-history: 90
    total-size-cap: 5GB

# Actuator endpoints - Restricted in production
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true

# Security Headers
server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: true
        same-site: strict
